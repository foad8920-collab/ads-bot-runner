name: Run Facebook Bot 2

on:
  workflow_dispatch: # يتيح التشغيل اليدوي أو عن طريق الـ API من التطبيق/Supabase

jobs:
  run-bot2:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 جلب كود المستودع
        uses: actions/checkout@v4

      - name: 🟢 إعداد بيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 تثبيت المكتبات (Dependencies)
        run: |
          npm init -y
          npm install playwright @supabase/supabase-js axios

      - name: 🌐 تثبيت متصفح Chromium الخاص بـ Playwright
        run: |
          npx playwright install --with-deps chromium

      - name: 🚀 تشغيل البوت الثاني (bot2.js)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node bot2.js
